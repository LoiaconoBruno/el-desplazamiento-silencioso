<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 424" width="760" height="424" role="img" aria-label="Cada decisión razonable hace más fácil la siguiente" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="13">
  <title>Cada decisión razonable hace más fácil la siguiente</title>
  <defs>
    <marker id="flecha" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10z" fill="#8f8e86"/>
    </marker>
  </defs>
  <rect x="0" y="0" width="760" height="424" rx="12" fill="#ffffff"/>
  <text x="24" y="34" font-size="15" font-weight="600" fill="#1f1f1d">Cada decisión razonable hace más fácil la siguiente</text>
  <g fill="none" stroke="#8f8e86" stroke-width="1.25">
    <path d="M487 100 Q 600 100 610 185" marker-end="url(#flecha)"/>
    <path d="M610 243 Q 615 330 562 340" marker-end="url(#flecha)"/>
    <path d="M398 370 H364" marker-end="url(#flecha)"/>
    <path d="M200 342 Q 140 310 150 245" marker-end="url(#flecha)"/>
    <path d="M150 187 Q 150 100 271 100" marker-end="url(#flecha)"/>
  </g>
  <g fill="none" stroke="#8f8e86" stroke-width="1.25">
    <rect x="273" y="72" width="214" height="56" rx="8"/>
    <rect x="503" y="187" width="214" height="56" rx="8"/>
    <rect x="398" y="342" width="214" height="56" rx="8"/>
    <rect x="148" y="342" width="214" height="56" rx="8"/>
    <rect x="43" y="187" width="214" height="56" rx="8"/>
  </g>
  <g text-anchor="middle" fill="#1f1f1d">
    <text><tspan x="380" y="95">Una empresa adopta IA</tspan><tspan x="380" y="113">para bajar costos</tspan></text>
    <text><tspan x="610" y="210">Sus competidoras la imitan</tspan><tspan x="610" y="228">para no perder clientes</tspan></text>
    <text><tspan x="505" y="365">Se contrata menos gente,</tspan><tspan x="505" y="383">sobre todo principiantes</tspan></text>
    <text><tspan x="255" y="365">Los trabajadores pierden</tspan><tspan x="255" y="383">poder de negociación</tspan></text>
    <text><tspan x="150" y="210">Hay menos resistencia a</tspan><tspan x="150" y="228">la próxima automatización</tspan></text>
  </g>
  <text text-anchor="middle" fill="#6b6a64"><tspan x="380" y="226">Cada vuelta deja menos</tspan><tspan x="380" y="244">poder para frenar</tspan><tspan x="380" y="262">la siguiente</tspan></text>
</svg>
